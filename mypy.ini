[mypy]
python_version = 3.12
strict = True
# Note: the "no Any" rule is enforced by ruff ANN401 (bans Any in annotations),
# NOT by mypy's disallow_any_explicit — that flag flags pydantic's own generated
# __init__(**data: Any) on every model, and this codebase is pydantic everywhere.
plugins = pydantic.mypy
mypy_path = python
explicit_package_bases = True
namespace_packages = True
warn_unused_configs = True
